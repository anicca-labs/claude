name: Release plugin

# Auto-bumps the version of every plugin changed on main, so consumers get the
# update via `plugin update`. For a Claude Code marketplace the repo IS the
# registry, so bumping the version on main is the "publish".
#
# No manual version edits needed. (You CAN still hand-bump for a minor/major —
# this job detects that a plugin's version already changed and skips it, so no
# double-bump.) New plugins under plugins/ are picked up automatically.

on:
  push:
    branches: [main]
    paths:
      - 'plugins/**'

permissions:
  contents: write

concurrency:
  group: release-plugin
  cancel-in-progress: false

jobs:
  bump:
    # Belt-and-suspenders: GITHUB_TOKEN pushes don't trigger workflows anyway,
    # and the release commit carries [skip ci].
    if: ${{ !contains(github.event.head_commit.message, 'chore(release)') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          package-manager-cache: false  # repo pins yarn@4.9.2 via corepack; skip v5 auto-cache

      - name: Bump changed plugins
        run: |
          BEFORE='${{ github.event.before }}'
          AFTER='${{ github.sha }}'
          if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
            BEFORE="$AFTER~1"
          fi

          ver() { node -pe 'JSON.parse(require("fs").readFileSync(0,"utf8")).version' 2>/dev/null; }

          # Assigned separately so a failing diff fails the job instead of
          # silently releasing nothing.
          CHANGED=$(git diff --name-only "$BEFORE" "$AFTER" -- plugins/ | cut -d/ -f2 | sort -u)

          RELEASED=()
          for PLUGIN in $CHANGED; do
            PJ="plugins/$PLUGIN/.claude-plugin/plugin.json"
            [ -f "$PJ" ] || { echo "$PLUGIN: no plugin.json (removed?) — skipping."; continue; }

            CUR=$(ver < "$PJ")
            OLD=$(git show "$BEFORE:$PJ" 2>/dev/null | ver || echo "")
            if [ -n "$OLD" ] && [ "$OLD" != "$CUR" ]; then
              echo "$PLUGIN: version already changed ($OLD -> $CUR) — skipping auto-bump."
              continue
            fi

            NEW=$(node -e 'const fs=require("fs");const p=process.argv[1];let s=fs.readFileSync(p,"utf8");const m=s.match(/"version":\s*"(\d+)\.(\d+)\.(\d+)"/);const v=[+m[1],+m[2],+m[3]+1].join(".");fs.writeFileSync(p,s.replace(/("version":\s*")\d+\.\d+\.\d+(")/,"$1"+v+"$2"));console.log(v);' "$PJ")
            git add "$PJ"

            # Keep package.json in lockstep where a plugin has one.
            PKG="plugins/$PLUGIN/package.json"
            if [ -f "$PKG" ]; then
              node -e 'const fs=require("fs");const p=process.argv[1];const v=process.argv[2];let s=fs.readFileSync(p,"utf8");fs.writeFileSync(p,s.replace(/("version":\s*")\d+\.\d+\.\d+(")/,"$1"+v+"$2"));' "$PKG" "$NEW"
              git add "$PKG"
            fi

            echo "$PLUGIN: bumped to $NEW"
            RELEASED+=("$PLUGIN v$NEW")
          done

          if [ ${#RELEASED[@]} -eq 0 ]; then
            echo "Nothing to release."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          MSG=$(IFS=,; echo "${RELEASED[*]}" | sed 's/,/, /g')
          git commit --no-verify -m "chore(release): $MSG [skip ci]"
          git push
