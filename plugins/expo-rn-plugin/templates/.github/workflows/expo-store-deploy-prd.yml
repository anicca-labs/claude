name: Build and Deploy to App Stores (prd)

on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'yarn.lock'
      - 'app.config.ts'
      - 'eas.json'
      - 'google-services-prd.json'
      - 'GoogleService-Info-prd.plist'
  workflow_dispatch:
    inputs:
      platform:
        description: 'Platform'
        required: true
        type: choice
        options:
          - all
          - ios
          - android
      version:
        description: 'Force marketing version X.Y.Z (leave empty to derive from conventional commits)'
        required: false
        type: string
        default: ''
      skip_version_bump:
        description: 'Build package.json as-is — for re-running a version the stores never accepted'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  detect-platform:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      platform: ${{ steps.detect.outputs.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: changes
        with:
          filters: |
            native:
              - 'package.json'
              - 'yarn.lock'
              - 'app.config.ts'
              - 'eas.json'
            android:
              - 'google-services-prd.json'
            ios:
              - 'GoogleService-Info-prd.plist'
      - id: detect
        run: |
          if [[ "${{ steps.changes.outputs.native }}" == "true" ]]; then
            echo "platform=all" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.changes.outputs.android }}" == "true" && "${{ steps.changes.outputs.ios }}" == "true" ]]; then
            echo "platform=all" >> "$GITHUB_OUTPUT"
          elif [[ "${{ steps.changes.outputs.android }}" == "true" ]]; then
            echo "platform=android" >> "$GITHUB_OUTPUT"
          else
            echo "platform=ios" >> "$GITHUB_OUTPUT"
          fi

  # Apple rejects a submission whose CFBundleShortVersionString was already used, so a
  # store release MUST carry a fresh marketing version. If bumping is a separate manual
  # step, this automatic path is structurally guaranteed to half-fail: Android gates on
  # versionCode so it sails through, while iOS rejects AT SUBMISSION — after a full
  # build. Resolve the version here instead, so nothing has to be remembered.
  #
  # The version derives from the branch being built (main) but the bump COMMIT is pushed
  # to stg, preserving the stg-first rule that CI never commits to main — it reaches main
  # on the next normal merge. The build doesn't need that commit: `eas build --local`
  # builds the WORKING TREE, which the deploy jobs stamp from this job's output.
  resolve-version:
    if: ${{ always() && !failure() && !cancelled() }}
    needs: [detect-platform]
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history so the conventional-commit scan can see it
      - uses: actions/setup-node@v4
        with:
          node-version: '23'

      - id: resolve
        # Free-text dispatch inputs go through env, never interpolated into the shell
        # source — `${{ }}` is textual substitution and would execute anything quoted
        # into it.
        env:
          FORCED: ${{ inputs.version }}
          SKIP: ${{ inputs.skip_version_bump }}
        run: |
          set -euo pipefail
          if [[ "$SKIP" == "true" ]]; then
            echo "skip_version_bump — building package.json as-is"
            echo "version=" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [[ -n "$FORCED" ]]; then
            node scripts/next-version.mjs --set "$FORCED" | tee /tmp/version.json
          else
            node scripts/next-version.mjs | tee /tmp/version.json
          fi
          CURRENT=$(node -e 'console.log(require("/tmp/version.json").current)')
          NEXT=$(node -e 'console.log(require("/tmp/version.json").next)')
          # No releasable commits since the last version — nothing to bump. Build what
          # the branch already has; the stores decide whether they'll take it.
          if [[ "$NEXT" == "$CURRENT" ]]; then
            echo "no bump warranted (still $CURRENT)"
            echo "version=" >> "$GITHUB_OUTPUT"
          else
            echo "version=$NEXT" >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### Version"
            echo '```json'
            cat /tmp/version.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Record the bump on stg so the next release computes from it. This runs BEFORE
      # the build on purpose: a version we can't record is a version we'd compute again
      # next time and resubmit — exactly the rejection this job exists to stop.
      - name: Record bump on stg
        if: ${{ steps.resolve.outputs.version != '' }}
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin stg
            git checkout -B stg origin/stg
            CURRENT=$(node -e 'console.log(require("./package.json").version)')
            if [[ "$CURRENT" == "$VERSION" ]]; then
              echo "stg already at $VERSION — nothing to record"
              exit 0
            fi
            node scripts/next-version.mjs --set "$VERSION" --apply
            git commit -am "chore(release): v$VERSION [skip ci]"
            # ANNOTATED — `push --follow-tags` ignores lightweight tags. -f so a retry
            # after a rejected push can re-tag the rebuilt commit.
            git tag -f -a "v$VERSION" -m "v$VERSION"
            if git push origin stg --follow-tags; then
              echo "recorded v$VERSION on stg"
              exit 0
            fi
            echo "push rejected (attempt $attempt) — stg moved, retrying"
            git reset --hard "origin/stg"
          done
          echo "::error::could not record v$VERSION on stg after 3 attempts — not building a version we can't track"
          exit 1

  deploy:
    needs: [detect-platform, resolve-version]
    # `always()` is here only to tolerate detect-platform being SKIPPED on dispatch — it
    # must not extend to resolve-version. A cancelled resolver (runner starvation cancels
    # jobs before they record a step) leaves `outputs.version` empty, which the deploy
    # jobs read as "build package.json as-is" — silently shipping the stale version this
    # job exists to prevent. `failure()`/`cancelled()` don't catch it: a cancelled NEED is
    # neither a workflow failure nor a workflow cancellation. Require success explicitly.
    if: ${{ always() && !failure() && !cancelled() && needs.resolve-version.result == 'success' }}
    uses: ./.github/workflows/expo-store-deploy.yml
    secrets: inherit
    with:
      environment: prd
      platform: ${{ github.event_name == 'push' && needs.detect-platform.outputs.platform || inputs.platform }}
      version: ${{ needs.resolve-version.outputs.version }}
