name: Store Deploy (reusable)

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      platform:
        required: true
        type: string
      version:
        description: 'Marketing version to build (X.Y.Z). Empty = use package.json as-is.'
        required: false
        type: string
        default: ''

jobs:
  deploy-android:
    if: ${{ inputs.platform == 'android' || inputs.platform == 'all' }}
    uses: ./.github/workflows/expo-android-deploy.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      node-version: '23'
      version: ${{ inputs.version }}

  deploy-ios:
    if: ${{ inputs.platform == 'ios' || inputs.platform == 'all' }}
    uses: ./.github/workflows/expo-ios-deploy.yml
    secrets: inherit
    with:
      environment: ${{ inputs.environment }}
      node-version: '23'
      version: ${{ inputs.version }}
