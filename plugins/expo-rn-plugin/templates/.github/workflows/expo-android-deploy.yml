name: Expo Android Deploy

on:
  workflow_call:
    inputs:
      environment:
        description: 'Environment (stg, prd)'
        required: true
        type: string
      node-version:
        required: true
        type: string
      version:
        description: 'Marketing version to build (X.Y.Z). Empty = use package.json as-is.'
        required: false
        type: string
        default: ''
      yarn-version:
        required: false
        type: string
        default: '4.9.2'

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # The full SDK 56 release build (multi-ABI native libs + lint-vital AARs)
      # exhausts the ubuntu runner's ~14 GB disk — `bundleReleaseLocalLintAar`
      # fails with "Could not add file ... to ZIP" once free space hits ~0.
      # Reclaim space from pre-installed toolchains the build doesn't use. Keep
      # the Android SDK/NDK and the hosted tool cache (Node lives there).
      - name: Free up disk space
        run: |
          echo "Before:"; df -h /
          sudo rm -rf /usr/share/dotnet || true
          sudo rm -rf /opt/ghc /usr/local/.ghcup || true
          sudo rm -rf /usr/share/swift || true
          sudo rm -rf /opt/hostedtoolcache/CodeQL || true
          sudo rm -rf /usr/local/share/powershell /usr/share/miniconda || true
          sudo docker image prune --all --force || true
          echo "After:"; df -h /

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ inputs.node-version }}

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Yarn
        run: |
          corepack prepare yarn@${{ inputs.yarn-version }} --activate
          yarn --version

      - name: Install dependencies
        run: yarn install --immutable

      - name: Setup Gradle properties
        run: |
          mkdir -p ~/.gradle
          echo "org.gradle.jvmargs=-Xmx6g -XX:MaxMetaspaceSize=2048m" >> ~/.gradle/gradle.properties

      - name: Install Doppler CLI
        run: |
          curl -Ls https://cli.doppler.com/install.sh | sudo sh
          doppler --version

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Write Google Play service account key
        run: echo '${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}' > eas-service-account.json

      # `eas build --local` builds the WORKING TREE, not a git commit — so stamping the
      # version here is enough to reach versionName (app.config.ts reads package.json).
      # The commit recording this version is pushed to stg by the caller's
      # resolve-version job; CI never commits to main.
      - name: Stamp marketing version
        if: ${{ inputs.version != '' }}
        env:
          VERSION: ${{ inputs.version }}
        run: |
          node -e '
            const fs = require("fs");
            const pkg = JSON.parse(fs.readFileSync("package.json", "utf8"));
            pkg.version = process.env.VERSION;
            fs.writeFileSync("package.json", JSON.stringify(pkg, null, 2) + "\n");
          '
          node -e 'console.log("building version", require("./package.json").version)'

      - name: Build and Deploy to Google Play Store
        run: yarn deploy-store-android
        env:
          ENV: ${{ inputs.environment }}
          # Config-scoped Doppler service tokens, one per env (DOPPLER_TOKEN = stg,
          # DOPPLER_TOKEN_PROD = prd). Never use a personal token in CI.
          DOPPLER_TOKEN: ${{ inputs.environment == 'prd' && secrets.DOPPLER_TOKEN_PROD || secrets.DOPPLER_TOKEN }}
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
