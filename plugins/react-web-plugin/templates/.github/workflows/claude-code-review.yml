# Automatic Claude code review on every PR.
# Requires the Claude GitHub App + one repo secret — easiest setup is running
# /install-github-app from an interactive Claude Code session in the repo.
# Auth: teams on Claude subscriptions use CLAUDE_CODE_OAUTH_TOKEN (generate once
# with `claude setup-token`); API-billing teams use ANTHROPIC_API_KEY instead.
name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    runs-on: ubuntu-latest
    # Skip bot PRs (dependabot/renovate) to control cost
    if: ${{ !contains(fromJSON('["dependabot[bot]", "renovate[bot]"]'), github.actor) }}
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          # For API billing, replace the line above with:
          # anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          plugin_marketplaces: "https://github.com/anthropics/claude-code.git"
          plugins: "code-review@claude-code-plugins"
          prompt: >-
            /code-review:code-review --comment
            ${{ github.repository }}/pull/${{ github.event.pull_request.number }}.
            If the file .github/review-focus.md exists in this repository, read it
            first and give its points extra attention during the review.
          claude_args: '--allowedTools "mcp__github_inline_comment__create_inline_comment"'
